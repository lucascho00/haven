<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#D6CFC3"/>
    </linearGradient>
    <linearGradient id="caseO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF3C3C"/>
      <stop offset="1" stop-color="#A31515"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgO)"/>

  <!-- Handle -->
  <rect x="380" y="180" width="264" height="80" rx="38"
        fill="#374151" stroke="#1F2937" stroke-width="6"/>
  <rect x="430" y="208" width="164" height="24" rx="10" fill="#1F2937"/>

  <!-- Kit case — clean, no seam or latch to keep it modern/minimal -->
  <rect x="180" y="260" width="664" height="600" rx="72"
        fill="url(#caseO)" stroke="#7C0808" stroke-width="10"/>

  <!-- Inner highlight along the top edge of the case for a polished look -->
  <rect x="200" y="280" width="624" height="14" rx="6"
        fill="white" opacity="0.18"/>

  <!-- Bold white "H" — fills more of the face, no cross accent -->
  <g fill="white">
    <rect x="262" y="338" width="138" height="484" rx="32"/>
    <rect x="624" y="338" width="138" height="484" rx="32"/>
    <rect x="262" y="528" width="500" height="104" rx="24"/>
  </g>
</svg>
