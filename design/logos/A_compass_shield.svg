<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1B2C4F"/>
      <stop offset="1" stop-color="#0A1530"/>
    </linearGradient>
    <linearGradient id="redA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5252"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background — iOS will round the corners automatically -->
  <rect width="1024" height="1024" fill="url(#bgA)"/>

  <!-- Subtle cyan glow behind shield -->
  <circle cx="512" cy="528" r="320" fill="#00BCD4" opacity="0.10"/>

  <!-- Shield outline -->
  <path d="M512 180
           L780 290
           L780 540
           Q780 720 512 880
           Q244 720 244 540
           L244 290 Z"
        fill="none"
        stroke="#80DEEA"
        stroke-width="22"
        stroke-linejoin="round"/>

  <!-- Compass dial tick marks (N E S W) -->
  <g stroke="#80DEEA" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="512" y1="280" x2="512" y2="310"/>
    <line x1="512" y1="746" x2="512" y2="776"/>
    <line x1="280" y1="528" x2="310" y2="528"/>
    <line x1="714" y1="528" x2="744" y2="528"/>
  </g>

  <!-- North needle (red, pointing up) -->
  <polygon points="512,308 596,528 428,528" fill="url(#redA)"/>
  <!-- South needle (gray, pointing down) -->
  <polygon points="512,748 596,528 428,528" fill="#607D8B"/>

  <!-- "N" label inside red tip -->
  <text x="512" y="430"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="92"
        text-anchor="middle"
        fill="white">N</text>

  <!-- Center pivot -->
  <circle cx="512" cy="528" r="34" fill="#0A1530"/>
  <circle cx="512" cy="528" r="34" fill="none" stroke="white" stroke-width="6"/>
</svg>
