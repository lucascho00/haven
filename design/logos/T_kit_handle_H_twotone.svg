<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#D6CFC3"/>
    </linearGradient>
    <linearGradient id="lidT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5252"/>
      <stop offset="1" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="bodyT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B71C1C"/>
      <stop offset="1" stop-color="#7C0808"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgT)"/>

  <!-- Handle -->
  <rect x="380" y="180" width="264" height="80" rx="38"
        fill="#374151" stroke="#1F2937" stroke-width="6"/>
  <rect x="430" y="208" width="164" height="24" rx="10" fill="#1F2937"/>

  <!-- Lid (lighter red, top portion of the case) -->
  <path d="M 244 260
           L 780 260
           Q 844 260 844 324
           L 844 396
           L 180 396
           L 180 324
           Q 180 260 244 260 Z"
        fill="url(#lidT)" stroke="#7C0808" stroke-width="10"/>

  <!-- Body (darker red, bottom portion) -->
  <path d="M 180 396
           L 844 396
           L 844 796
           Q 844 860 780 860
           L 244 860
           Q 180 860 180 796 Z"
        fill="url(#bodyT)" stroke="#7C0808" stroke-width="10"/>

  <!-- Latch sits on the seam line between lid and body -->
  <rect x="476" y="372" width="72" height="48" rx="8"
        fill="white" stroke="#7C0808" stroke-width="4"/>

  <!-- Big white "H" on the darker body -->
  <g fill="white">
    <rect x="284" y="460" width="116" height="350" rx="28"/>
    <rect x="624" y="460" width="116" height="350" rx="28"/>
    <rect x="284" y="596" width="456" height="92" rx="20"/>
  </g>

  <!-- Red "+" inside the H crossbar -->
  <g fill="#7C0808">
    <rect x="498" y="614" width="28" height="56" rx="5"/>
    <rect x="484" y="628" width="56" height="28" rx="5"/>
  </g>
</svg>
