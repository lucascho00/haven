<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FBF6"/>
      <stop offset="1" stop-color="#D9EFE0"/>
    </linearGradient>
    <linearGradient id="crossH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgH)"/>

  <!-- Soft inner shadow on background -->
  <rect x="40" y="40" width="944" height="944" rx="160"
        fill="none" stroke="#1B5E20" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Bold green cross with rounded ends (pharmacy style) -->
  <g fill="url(#crossH)">
    <rect x="424" y="200" width="176" height="624" rx="80"/>
    <rect x="200" y="424" width="624" height="176" rx="80"/>
  </g>

  <!-- Light highlight band across the top of the cross to give it depth -->
  <g fill="white" opacity="0.18">
    <rect x="436" y="216" width="152" height="50" rx="20"/>
  </g>

  <!-- Tiny "+" accent in the center (subtle) -->
  <g fill="white" opacity="0.55">
    <rect x="494" y="468" width="36" height="88" rx="6"/>
    <rect x="468" y="494" width="88" height="36" rx="6"/>
  </g>
</svg>
