<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#D6CFC3"/>
    </linearGradient>
    <linearGradient id="caseN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF3C3C"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="lidN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6464"/>
      <stop offset="1" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgN)"/>

  <!-- Carry handle (tilted slightly with the lid) -->
  <g transform="rotate(-8, 512, 220)">
    <rect x="380" y="180" width="264" height="80" rx="38"
          fill="#374151" stroke="#1F2937" stroke-width="6"/>
    <rect x="430" y="208" width="164" height="24" rx="10" fill="#1F2937"/>
  </g>

  <!-- Kit body (lower half) -->
  <rect x="180" y="430" width="664" height="430" rx="64"
        fill="url(#caseN)" stroke="#7C0808" stroke-width="10"/>

  <!-- Big white "H" on the front of the body -->
  <g fill="white">
    <rect x="284" y="480" width="116" height="320" rx="28"/>
    <rect x="624" y="480" width="116" height="320" rx="28"/>
    <rect x="284" y="606" width="456" height="92" rx="20"/>
  </g>

  <!-- Red "+" inside the H crossbar -->
  <g fill="#B71C1C">
    <rect x="498" y="624" width="28" height="56" rx="5"/>
    <rect x="484" y="638" width="56" height="28" rx="5"/>
  </g>

  <!-- Hinged lid — slightly lifted (rotated), with a soft inner glow -->
  <g transform="rotate(-12, 220, 430)">
    <rect x="180" y="300" width="664" height="140" rx="48"
          fill="url(#lidN)" stroke="#7C0808" stroke-width="10"/>
    <!-- Inner glow strip suggests "supplies inside" -->
    <rect x="200" y="408" width="624" height="14" rx="6"
          fill="#FFEB3B" opacity="0.55"/>
  </g>
</svg>
