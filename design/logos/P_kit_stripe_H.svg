<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#D6CFC3"/>
    </linearGradient>
    <linearGradient id="caseP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF3C3C"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgP)"/>

  <!-- Handle -->
  <rect x="380" y="180" width="264" height="80" rx="38"
        fill="#374151" stroke="#1F2937" stroke-width="6"/>
  <rect x="430" y="208" width="164" height="24" rx="10" fill="#1F2937"/>

  <!-- Kit case -->
  <rect x="180" y="260" width="664" height="600" rx="64"
        fill="url(#caseP)" stroke="#7C0808" stroke-width="10"/>

  <!-- Wide horizontal white stripe band — classic safety-kit banding -->
  <rect x="180" y="468" width="664" height="184" fill="white"/>
  <!-- Thin red borders above + below the stripe so it reads as a wrap -->
  <rect x="180" y="464" width="664" height="6" fill="#7C0808" opacity="0.6"/>
  <rect x="180" y="652" width="664" height="6" fill="#7C0808" opacity="0.6"/>

  <!-- Red "H" letterform sitting on the white stripe -->
  <g fill="#B71C1C">
    <rect x="320" y="488" width="92" height="144" rx="22"/>
    <rect x="612" y="488" width="92" height="144" rx="22"/>
    <rect x="320" y="544" width="384" height="40" rx="10"/>
  </g>

  <!-- Compact red "+" tucked just inside the right edge of the H crossbar
       — preserves the first-aid signal without crowding the typography -->
  <g fill="#B71C1C">
    <rect x="760" y="546" width="14" height="38" rx="3"/>
    <rect x="748" y="557" width="38" height="14" rx="3"/>
  </g>

  <!-- Lid latch hint above the stripe (small white pill) -->
  <rect x="486" y="380" width="52" height="32" rx="6"
        fill="white" stroke="#7C0808" stroke-width="3"/>
</svg>
